# .lanes.conf — per-repo settings for lanes (sourced as bash; commit it).
# Every line is optional; the values shown are the defaults unless noted.

# Compose project prefix: lane containers are <LANES_NAME>-<slug>-<service>-1.
# LANES_NAME="myapp"                       # default: the repo folder name

# Where lanes live (next to the main checkout).
# LANES_ROOT="$(dirname "$MAIN")/myapp-lanes"

# New lanes branch from here; the main checkout stays on the default branch.
# LANES_BASE="origin/main"
# LANES_DEFAULT_BRANCH="main"
# LANES_BRANCH_TYPES="feat|fix|chore|docs|refactor|perf|test|style|ci|build"

# Dev stack. Empty LANES_COMPOSE_FILE = lanes without a stack (docs, libraries).
# LANES_COMPOSE_FILE="docker-compose.yml"
# LANES_ENV_FILE=".env.local"              # copied from the main checkout into each lane

# Host ports: lane n gets base+n. Your compose file must read them, e.g.
#   ports: ['${FRONTEND_PORT:-5173}:5173']
LANES_PORTS="FRONTEND_PORT=5173 BACKEND_PORT=3000"

# Extra env lines per lane; ${PORT_VAR} is replaced. No spaces inside an entry.
LANES_EXTRA_ENV='FRONTEND_URL=http://localhost:${FRONTEND_PORT}'

# Printed by `lanes url` and after `lanes up`.
LANES_URL='http://localhost:${FRONTEND_PORT}'

# Database (Postgres). Set the service name to enable --db clone|empty.
LANES_DB_SERVICE="postgres"
# For --db empty: compose arguments that build the schema from scratch.
# LANES_DB_BOOTSTRAP="run --rm --no-deps backend npm run db:migrate"
# LANES_DB_DEFAULT="auto"                  # auto: clone when the main DB runs, else empty

# GitNexus code-intelligence index per lane (only if GitNexus is installed).
# LANES_GITNEXUS="auto"                    # or "off"

# Claude Code WorktreeCreate hook (templates/settings.worktree-hooks.json).
# LANES_AGENT_PREFIX="agent"               # branch for random names: agent/bold-oak-a3f2
# LANES_HOOK_UP=0                          # 1: also build + start the stack (slow for subagents)
# LANES_HOOK_INDEX=1                       # build the code index (GitNexus, if installed)
